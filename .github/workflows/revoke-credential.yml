name: Revoke credential

# Status changes for issued credentials (conformance program v1.5):
# revocation (terminal), suspension (reversible, renders "under appeal"),
# and unsuspend. Same custody model as issuance: the job runs in the
# `conformance-issuance` protected environment, so the required reviewer(s)
# must approve the run - the approval is the human act, the PR this opens
# (carrying the stated reason) is the auditable record, and merging deploys
# the re-signed status list. Only K_STATUS_PRIVATE ever touches a bit; the
# issuer key cannot (key separation, so a stolen issuer key can never clear
# its own revocation bits).
#
# CI NOTE: as with issuance, a PR opened with the workflow token does not
# trigger the Validate workflow; close/reopen the PR for the green check.

on:
  workflow_dispatch:
    inputs:
      credential_id:
        description: "Credential id: urn:kya:conf:<32 hex> (or the bare 32 hex)"
        required: true
      purpose:
        description: "revocation is terminal; suspension renders under appeal; unsuspend clears a suspension"
        required: true
        type: choice
        options: [revocation, suspension, unsuspend]
      reason:
        description: "Public reason, recorded verbatim in the PR"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: conformance-issuance
  cancel-in-progress: false

jobs:
  revoke:
    runs-on: ubuntu-latest
    environment: conformance-issuance
    steps:
      - uses: actions/checkout@v6
      # Allocation state advances at PR MERGE, not at run end - two queued
      # runs would each read the same allocations.json from main and mint the
      # same status index. Issuance and revocation are therefore one-in-flight
      # by design: refuse while any prior issuance/revoke PR is still open.
      - name: Refuse while another issuance PR is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select((.headRefName | startswith("issuance/")) or (.headRefName | startswith("revoke/")))] | length')
          if [ "$open" != "0" ]; then
            echo "::error::another issuance/revocation PR is open - merge or close it first (allocation state advances at merge, so state-changing runs are one-in-flight)"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Flip the bit, re-sign, re-verify
        env:
          K_STATUS_PRIVATE: ${{ secrets.K_STATUS_PRIVATE }}
          IN_CREDENTIAL_ID: ${{ inputs.credential_id }}
          IN_PURPOSE: ${{ inputs.purpose }}
          IN_REASON: ${{ inputs.reason }}
        run: >
          node scripts/revoke-credential.mjs
          --credential-id "$IN_CREDENTIAL_ID"
          --purpose "$IN_PURPOSE"
          --reason "$IN_REASON"
          --summary "$RUNNER_TEMP/revoke-summary.json"
          --pr-body "$RUNNER_TEMP/revoke-pr-body.md"
      - name: Open the status-change PR
        env:
          GH_TOKEN: ${{ github.token }}
          IN_PURPOSE: ${{ inputs.purpose }}
        run: |
          ID8=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/revoke-summary.json','utf8')).id8")
          SLUG=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/revoke-summary.json','utf8')).slug")
          BRANCH="revoke/${ID8}-${IN_PURPOSE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add registry workers/badge/generated-allowlist.mjs
          git commit -s -m "feat(conformance): ${IN_PURPOSE} for ${SLUG} credential ${ID8}"
          git push origin "$BRANCH"
          gh pr create \
            --title "conformance: ${IN_PURPOSE} for ${SLUG} (${ID8})" \
            --body-file "$RUNNER_TEMP/revoke-pr-body.md" \
            --base main --head "$BRANCH"
