name: Issue credential

# Managed-key credential issuance (conformance program v1.5).
#
# CUSTODY MODEL: the job runs in the `conformance-issuance` protected
# environment, so the run BLOCKS until the environment's required reviewer(s)
# approve it - that approval is the human act of issuance, recorded by GitHub
# next to the run. The private keys exist only as environment secrets
# (K_ISSUER_PRIVATE / K_STATUS_PRIVATE), exposed to no other workflow, and
# scripts/issue-credential.mjs refuses to sign unless their public halves
# match registry/keys/program-keys.json. Start with one required reviewer
# (an auditable pause); moving to true two-person control at charter is a
# settings-only change - add a second required reviewer and enable
# "prevent self-review". Setup steps: conformance/README.md,
# "Issuance and custody (v1.5)".
#
# The PR this opens is the auditable issuance record; merging deploys the
# credential, the re-signed status lists, and the verified badge.
#
# INPUT NOTE: GitHub caps workflow_dispatch at 10 inputs; impl_repo is the
# one field dropped from the design - the script defaults it from the
# registry entry's own `repo`.
#
# CI NOTE: a PR opened with the workflow token does not trigger the Validate
# workflow (GitHub's recursion guard). The issuance script already ran the
# full validate + build + verify gate on this exact tree; to get the green
# check anyway, close and reopen the PR (or push an empty commit to the
# branch).

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Registry slug (registry/builders/<slug>.json, status in-verification)"
        required: true
      subject_id:
        description: "Credential subject id: https URL or DID of the implementation"
        required: true
      impl_name:
        description: "Implementation name (as verified)"
        required: true
      impl_version:
        description: "Implementation version (as verified)"
        required: true
      git_commit:
        description: "40-hex commit SHA the program re-ran"
        required: true
      level:
        description: "Verified level (must match the entry's claim)"
        required: true
        type: choice
        options: [L1, L2, L3]
      scope:
        description: "Verified scope (must match the entry's claim)"
        required: true
        type: choice
        options: [full, subset]
      categories:
        description: "Comma-separated categories - required iff scope is subset"
        required: false
        default: ""
      package_version:
        description: "@kya-os/mcp version the suite ran under"
        required: true
      verdict_url:
        description: "URL of the public verdict (the submission issue / re-run comment)"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: conformance-issuance
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    environment: conformance-issuance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      # Inputs travel through env (never interpolated into script text) so a
      # crafted input cannot inject shell. The script validates every one
      # against the registry entry and fails closed before signing.
      - name: Issue, sign, and re-verify
        env:
          K_ISSUER_PRIVATE: ${{ secrets.K_ISSUER_PRIVATE }}
          K_STATUS_PRIVATE: ${{ secrets.K_STATUS_PRIVATE }}
          IN_SLUG: ${{ inputs.slug }}
          IN_SUBJECT_ID: ${{ inputs.subject_id }}
          IN_IMPL_NAME: ${{ inputs.impl_name }}
          IN_IMPL_VERSION: ${{ inputs.impl_version }}
          IN_GIT_COMMIT: ${{ inputs.git_commit }}
          IN_LEVEL: ${{ inputs.level }}
          IN_SCOPE: ${{ inputs.scope }}
          IN_CATEGORIES: ${{ inputs.categories }}
          IN_PACKAGE_VERSION: ${{ inputs.package_version }}
          IN_VERDICT_URL: ${{ inputs.verdict_url }}
        run: >
          node scripts/issue-credential.mjs
          --slug "$IN_SLUG"
          --subject-id "$IN_SUBJECT_ID"
          --impl-name "$IN_IMPL_NAME"
          --impl-version "$IN_IMPL_VERSION"
          --git-commit "$IN_GIT_COMMIT"
          --level "$IN_LEVEL"
          --scope "$IN_SCOPE"
          --categories "$IN_CATEGORIES"
          --package-version "$IN_PACKAGE_VERSION"
          --verdict-url "$IN_VERDICT_URL"
          --summary "$RUNNER_TEMP/issuance-summary.json"
          --pr-body "$RUNNER_TEMP/issuance-pr-body.md"
      - name: Open the issuance PR
        env:
          GH_TOKEN: ${{ github.token }}
          IN_SLUG: ${{ inputs.slug }}
        run: |
          ID8=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/issuance-summary.json','utf8')).id8")
          CLAIM=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/issuance-summary.json','utf8')).claim")
          BRANCH="issuance/${IN_SLUG}-${ID8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add registry workers/badge/generated-allowlist.mjs
          git commit -s -m "feat(conformance): issue credential ${ID8} for ${IN_SLUG}"
          git push origin "$BRANCH"
          gh pr create \
            --title "conformance: issue ${IN_SLUG} ${CLAIM} credential (${ID8})" \
            --body-file "$RUNNER_TEMP/issuance-pr-body.md" \
            --base main --head "$BRANCH"
