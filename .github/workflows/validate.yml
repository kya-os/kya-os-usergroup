name: Validate

# Gating check for every PR and every push to main: the registry must
# validate structurally and the site must build. Zero npm dependencies, so
# there is nothing to install beyond Node itself. No third-party actions
# beyond actions/checkout and actions/setup-node.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Validate registry entries
        run: node scripts/validate.mjs
      - name: Build Pages artifact
        run: node site/build-pages.mjs
      - name: Badge worker tests (incl. cross-implementation parity)
        run: node --test workers/badge/*.test.mjs
      - name: Script tests (attestation core, issuance e2e dry run, vendored verifier)
        run: node --test scripts/__tests__/*.test.mjs
      # The one networked check: re-download the pinned npm tarballs, check
      # them against the registry's integrity, and fail if any committed file
      # under site/assets/vendor/ differs from what npm publishes.
      - name: Vendored verifier matches npm
        run: node scripts/vendor-verifier.mjs --check
      - name: Generated worker modules are committed and current
        run: git diff --exit-code workers/badge/generated-allowlist.mjs workers/badge/generated-keys.mjs
