name: Deploy badge worker

# Arms builders.kya-os.org/badge/* with request-time credential verification
# (Phase B of the conformance program - workers/badge/README.md carries the
# full runbook). workflow_dispatch ONLY, deliberately: deploying the worker
# hands the /badge/ paths from the static Pages tier to live verification,
# and that handover is a human decision, not a push side effect.
#
# The runbook's step 4 says what each step below refuses. The guards this
# job carries, and what they do not check, are listed once, in its "What the
# workflows check", after the deploy and rollback order ("Deploy order");
# workers/badge/deploy-guards.test.mjs pins them in this file.
#
# One-time setup (details in workers/badge/README.md, "Deploy runbook"), in
# the `production` environment, never as repository secrets:
#   - secret CLOUDFLARE_API_TOKEN_WORKER: a DEDICATED token with
#     Account > Workers Scripts > Edit plus Zone > Workers Routes > Edit on
#     the kya-os.org zone (the Pages deploy token stays Pages-only; the
#     maintainer creates this one at deploy time)
#   - secret CLOUDFLARE_ACCOUNT_ID (shared with the Pages deploy)
on:
  workflow_dispatch:

permissions:
  contents: read

# Scoped to the ref, so a run of this workflow on another ref cannot cancel
# main's deploy.
concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # A failing step rather than a job-level if: a run on another ref must
      # show as failed, never as a skipped run that looks green.
      - name: Deploy from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow deploys from refs/heads/main only, and this run is on $GITHUB_REF."
          exit 1
      # No later step pushes or calls GitHub, so the checkout leaves no
      # token in the working copy for them to read.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Node 24, an LTS line; the locked wrangler needs Node 22 or later.
      # Caching off, so no npm cache saved by another run reaches the install.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      # The locked toolchain, installed as the Pages deploy installs it.
      - name: Install the locked deploy toolchain
        run: npm ci --ignore-scripts --prefix tools/deploy
      - name: Build (validates registries, regenerates the worker's generated modules)
        run: node site/build-pages.mjs
      - name: Generated modules are committed and current
        run: git diff --exit-code workers/badge/generated-allowlist.mjs workers/badge/generated-keys.mjs
      - name: Refuse unprovisioned program keys
        run: |
          node --input-type=module -e '
            const { PROVISIONED, PINNED_ISSUER_KEYS, PINNED_STATUS_KEYS } = await import("./workers/badge/generated-keys.mjs");
            if (!PROVISIONED || PINNED_ISSUER_KEYS.length === 0 || PINNED_STATUS_KEYS.length === 0) {
              console.error("keys unprovisioned - merge the provisioning PR first");
              process.exit(1);
            }
            console.log(`pinned: ${PINNED_ISSUER_KEYS.length} issuer key(s), ${PINNED_STATUS_KEYS.length} status key(s)`);
          '
      - name: Full test suite (validate + build + badge/parity + conformance)
        run: npm test
      - name: Live credentials and status lists verify under this worker
        run: node workers/badge/preflight.mjs
      # The only step whose environment holds the Cloudflare token: it runs
      # the toolchain installed above and installs nothing.
      - name: Deploy the worker to the /badge/* zone route
        working-directory: workers/badge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../tools/deploy/node_modules/.bin/wrangler deploy
