name: Deploy badge worker

# Arms builders.kya-os.org/badge/* with request-time credential verification
# (Phase B of the conformance program - workers/badge/README.md carries the
# full runbook). workflow_dispatch ONLY, deliberately: deploying the worker
# hands the /badge/ paths from the static Pages tier to live verification,
# and that handover is a human decision, not a push side effect.
#
# Fail-closed gates, in order, before anything reaches Cloudflare:
#   1. the site build must pass (it validates the registries, verifies every
#      committed credential cryptographically, and regenerates the worker's
#      generated modules from committed state)
#   2. the regenerated modules must match the committed bytes - a deploy can
#      never ship pins or slugs that main does not carry
#   3. the pinned program keys must be PROVISIONED - the pre-ceremony
#      sentinel refuses here with "keys unprovisioned - merge the
#      provisioning PR first", so merging that PR is the arming step and
#      this workflow cannot front-run it
#   4. the full test suite must pass (badge worker + cross-implementation
#      parity + conformance program suites)
#
# One-time setup (details in workers/badge/README.md):
#   - repository secret CLOUDFLARE_API_TOKEN_WORKER: a DEDICATED token with
#     Account > Workers Scripts > Edit plus Zone > Workers Routes > Edit on
#     the kya-os.org zone (the Pages deploy token stays Pages-only; the
#     maintainer creates this one at deploy time)
#   - repository secret CLOUDFLARE_ACCOUNT_ID (shared with the Pages deploy)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Build (validates registries, regenerates the worker's generated modules)
        run: node site/build-pages.mjs
      - name: Generated modules are committed and current
        run: git diff --exit-code workers/badge/generated-allowlist.mjs workers/badge/generated-keys.mjs
      - name: Refuse unprovisioned program keys
        run: |
          node --input-type=module -e '
            const { PROVISIONED, PINNED_ISSUER_KEYS, PINNED_STATUS_KEYS } = await import("./workers/badge/generated-keys.mjs");
            if (!PROVISIONED || PINNED_ISSUER_KEYS.length === 0 || PINNED_STATUS_KEYS.length === 0) {
              console.error("keys unprovisioned - merge the provisioning PR first");
              process.exit(1);
            }
            console.log(`pinned: ${PINNED_ISSUER_KEYS.length} issuer key(s), ${PINNED_STATUS_KEYS.length} status key(s)`);
          '
      - name: Full test suite (validate + build + badge/parity + conformance)
        run: npm test
      # A plain wrangler invocation instead of cloudflare/wrangler-action,
      # for the same reason as the Pages deploy: the action's internal npx
      # install cancels on this lockfile-less zero-dependency repo.
      - name: Deploy the worker to the /badge/* zone route
        working-directory: workers/badge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
